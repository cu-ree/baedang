name: build-and-deploy

# 주 1회 자동 갱신 + 수동 실행
# 배당 데이터는 사업보고서 시즌(3월)에만 크게 바뀌므로 주 1회면 충분하다.
on:
  schedule:
    - cron: "0 9 * * 1"        # 매주 월요일 09:00 UTC = 18:00 KST
  workflow_dispatch:            # Actions 탭에서 수동 실행

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write           # site/ 와 dividend.db 를 커밋하기 위해 필요

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 1) 종목 마스터
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python step1_stocks.py

      - name: 2) 연간 배당 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python step2_annual.py

      - name: 3) 분기 배당 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python step3_quarter.py

      - name: 4) 파생 지표
        run: python step4_derive.py

      - name: 5) 사이트 생성
        run: python step5_build.py

      # 빈 사이트가 배포되는 것을 막는 최후 방어선.
      # 실패하면 커밋하지 않으므로 이전 버전이 그대로 서비스된다.
      - name: 배포 전 점검
        run: python verify.py

      - name: 변경 시 커밋 → GitHub Pages 자동 반영
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs dividend.db
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 배당 데이터 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
